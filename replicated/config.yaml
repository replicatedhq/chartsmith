apiVersion: kots.io/v1beta1
kind: Config
metadata:
  name: chartsmith
spec:
  groups:
    - name: external_database
      title: External Database Configuration
      description: To use an external database, enable this and provide the details for your postgres 17 with pgvector extension enabled database.
      items:
        - name: external_database
          title: External Database
          type: bool
          default: "0"
        - name: database_host
          title: Database Host
          type: text
          when: "{{repl ConfigOptionEquals \"external_database\" \"1\" }}"
        - name: database_port
          title: Database Port
          type: text
          when: "{{repl ConfigOptionEquals \"external_database\" \"1\" }}"
        - name: database_name
          title: Database Name
          type: text
          when: "{{repl ConfigOptionEquals \"external_database\" \"1\" }}"
        - name: database_user
          title: Database User
          type: text
          when: "{{repl ConfigOptionEquals \"external_database\" \"1\" }}"
        - name: database_password
          title: Database Password
          type: password
          when: "{{repl ConfigOptionEquals \"external_database\" \"1\" }}"
        - name: database_ssl_mode
          title: Database SSL Mode
          type: text
          when: "{{repl ConfigOptionEquals \"external_database\" \"1\" }}"
        - name: embedded_database_username
          title: Embedded Database Username
          type: text
          hidden: true
          value: "chartsmith"
          readonly: true
          when: "{{repl ConfigOptionEquals \"external_database\" \"0\" }}"
        - name: embedded_database_password
          title: Embedded Database Password
          type: password
          hidden: true
          value: "{{repl RandomString 32}}"
          readonly: true
          when: "{{repl ConfigOptionEquals \"external_database\" \"0\" }}"
        - name: embedded_database_name
          title: Embedded Database Name
          type: text
          hidden: true
          value: "chartsmith"
          readonly: true
          when: "{{repl ConfigOptionEquals \"external_database\" \"0\" }}"
    - name: llm_configuration
      title: LLM Configuration
      description: "Configure the LLM provider and model to use for the application."
      items:
        - name: llm_provider
          title: Model Provider
          type: select_one
          default: anthropic
          items:
            - name: anthropic
              title: Anthropic
            - name: fireworks
              title: Fireworks AI
        - name: anthropic_model
          title: Model
          type: select_one
          default: claude-sonnet-5
          when: 'repl{{ ConfigOptionEquals "llm_provider" "anthropic" }}'
          items:
            - name: claude-sonnet-5
              title: Claude Sonnet 5
            - name: claude-opus-5
              title: Claude Opus 5
            - name: claude-fable-5
              title: Claude Fable 5
        - name: fireworks_model
          title: Model
          type: select_one
          default: accounts/fireworks/models/kimi-k2-instruct-0905
          when: 'repl{{ ConfigOptionEquals "llm_provider" "fireworks" }}'
          items:
            - name: accounts/fireworks/models/kimi-k2-instruct-0905
              title: Kimi K2 Instruct 0905
            - name: accounts/fireworks/models/kimi-k2p5
              title: Kimi K2.5
        - name: anthropic_api_key
          title: Anthropic API Key
          type: password
          required: true
          when: 'repl{{ ConfigOptionEquals "llm_provider" "anthropic" }}'
        - name: fireworks_api_key
          title: Fireworks API Key
          type: password
          required: true
          when: 'repl{{ ConfigOptionEquals "llm_provider" "fireworks" }}'
    - name: auth
      title: Authentication Configuration
      description: "Google authentication is optional. When disabled, the site is available without a login."
      items:
        - name: google_auth_enabled
          title: Require Google Authentication
          type: bool
          default: "0"
        - name: google_client_id
          title: Google Client ID
          type: text
          required: true
          when: 'repl{{ ConfigOptionEquals "google_auth_enabled" "1" }}'
        - name: google_client_secret
          title: Google Client Secret
          type: password
          required: true
          when: 'repl{{ ConfigOptionEquals "google_auth_enabled" "1" }}'
        - name: google_redirect_uri
          title: Google Redirect URI
          type: text
          required: true
          when: 'repl{{ ConfigOptionEquals "google_auth_enabled" "1" }}'
    - name: secrets
      title: Application Secrets
      description: "Auto-generated secrets for the application. These are hidden and generated automatically."
      items:
        - name: hmac_secret
          title: HMAC Secret
          type: password
          hidden: true
          value: "{{repl RandomString 32}}"
          readonly: true
        - name: centrifugo_api_key
          title: Centrifugo API Key
          type: password
          hidden: true
          value: "{{repl RandomString 32}}"
          readonly: true
        - name: centrifugo_token_hmac_secret
          title: Centrifugo Token HMAC Secret
          type: password
          hidden: true
          value: "{{repl RandomString 32}}"
          readonly: true
        - name: centrifugo_admin_password
          title: Centrifugo Admin Password
          type: password
          hidden: true
          value: "{{repl RandomString 32}}"
          readonly: true
        - name: centrifugo_admin_secret
          title: Centrifugo Admin Secret
          type: password
          hidden: true
          value: "{{repl RandomString 32}}"
          readonly: true
